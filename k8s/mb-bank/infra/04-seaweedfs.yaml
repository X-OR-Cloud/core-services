# =============================================================================
# SeaweedFS 4.20 — S3-compatible object storage
# Image: chrislusf/seaweedfs:4.20 (load từ air-gap bundle)
#
# Architecture: Master (metadata) + Volume (data) + Filer (FS layer) + S3 Gateway
# Đây là single-node setup — đủ cho production nhỏ-vừa.
# =============================================================================

# ---- Master Server ----------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-master
  namespace: phuongn21-restricted
spec:
  serviceName: seaweedfs-master
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-master
  template:
    metadata:
      labels:
        app: seaweedfs-master
    spec:
      containers:
      - name: master
        image: chrislusf/seaweedfs:4.20
        imagePullPolicy: Never
        command: ["weed", "master", "-port=9333", "-mdir=/data"]
        ports:
        - name: http
          containerPort: 9333
        - name: grpc
          containerPort: 19333
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /cluster/status
            port: 9333
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-seaweedfs-master
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-master
  namespace: phuongn21-restricted
spec:
  selector:
    app: seaweedfs-master
  ports:
  - name: http
    port: 9333
    targetPort: 9333
  - name: grpc
    port: 19333
    targetPort: 19333
  clusterIP: None

---
# ---- Volume Server ----------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-volume
  namespace: phuongn21-restricted
spec:
  serviceName: seaweedfs-volume
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-volume
  template:
    metadata:
      labels:
        app: seaweedfs-volume
    spec:
      containers:
      - name: volume
        image: chrislusf/seaweedfs:4.20
        imagePullPolicy: Never
        command:
        - weed
        - volume
        - -mserver=seaweedfs-master:9333
        - -port=8080
        - -dir=/data
        - -max=0        # auto-grow
        - -ip.bind=0.0.0.0
        ports:
        - name: http
          containerPort: 8080
        - name: grpc
          containerPort: 18080
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-seaweedfs-volume
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-volume
  namespace: phuongn21-restricted
spec:
  selector:
    app: seaweedfs-volume
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  clusterIP: None

---
# ---- Filer + S3 Gateway -----------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-filer
  namespace: phuongn21-restricted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-filer
  template:
    metadata:
      labels:
        app: seaweedfs-filer
    spec:
      containers:
      - name: filer
        image: chrislusf/seaweedfs:4.20
        imagePullPolicy: Never
        command:
        - weed
        - filer
        - -master=seaweedfs-master:9333
        - -port=8888
        - -s3
        - -s3.port=8333
        - -s3.config=/etc/seaweedfs/s3.json
        ports:
        - name: filer
          containerPort: 8888
        - name: s3
          containerPort: 8333
        volumeMounts:
        - name: s3-config
          mountPath: /etc/seaweedfs
        readinessProbe:
          httpGet:
            path: /
            port: 8888
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
      volumes:
      - name: s3-config
        configMap:
          name: seaweedfs-s3-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: phuongn21-restricted
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "xai-admin",
          "credentials": [
            {
              "accessKey": "<S3_ACCESS_KEY>",
              "secretKey": "<S3_SECRET_KEY>"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: phuongn21-restricted
spec:
  selector:
    app: seaweedfs-filer
  ports:
  - name: s3
    port: 8333
    targetPort: 8333
  - name: filer
    port: 8888
    targetPort: 8888
