# =============================================================================
# AIWM Service — AI Workload Manager (8 modes)
# Image: xai/aiwm:latest (load từ air-gap bundle aiwm.tar.gz)
#
# Modes deploy:
#   api    (3330) — HTTP REST API + Swagger
#   mcp    (3355) — MCP server
#   aws    (3400) — Agent WebSocket gateway
#   nws    (3403) — Node WebSocket gateway
#   cws    (3407) — Chat WebSocket gateway
#   worker        — BullMQ job processor (no HTTP)
#   agt           — Hosted agent runner (no HTTP)
#   con           — Channel connector Discord/Telegram (no HTTP)
# =============================================================================

# ---- API Mode ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiwm-api
  namespace: hydra-prod
  labels:
    app: aiwm
    mode: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiwm
      mode: api
  template:
    metadata:
      labels:
        app: aiwm
        mode: api
    spec:
      containers:
      - name: aiwm
        image: xai/aiwm:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3330
          name: http
        env:
        - name: MODE
          value: "api"
        - name: PORT
          value: "3330"
        envFrom:
        - configMapRef:
            name: hydra-config
        - secretRef:
            name: hydra-db-secrets
        - secretRef:
            name: hydra-app-secrets
        volumeMounts:
        - name: license
          mountPath: /app/.license
          subPath: .license
          readOnly: true
        startupProbe:
          httpGet:
            path: /health
            port: 3330
          failureThreshold: 12
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3330
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3330
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
      volumes:
      - name: license
        secret:
          secretName: hydra-license
---
apiVersion: v1
kind: Service
metadata:
  name: aiwm-service
  namespace: hydra-prod
spec:
  selector:
    app: aiwm
    mode: api
  ports:
  - port: 3330
    targetPort: 3330

