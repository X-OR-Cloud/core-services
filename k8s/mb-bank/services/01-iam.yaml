# =============================================================================
# IAM Service — Identity & Access Management
# Image: xai/iam:latest (load từ air-gap bundle iam.tar.gz)
# Port: 3310
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: hydra-prod
  labels:
    app: iam
    version: "1.8.2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iam
  template:
    metadata:
      labels:
        app: iam
    spec:
      containers:
      - name: iam
        image: xai/iam:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3310
          name: http
        env:
        - name: PORT
          value: "3310"
        envFrom:
        - configMapRef:
            name: hydra-config
        - secretRef:
            name: hydra-db-secrets
        - secretRef:
            name: hydra-app-secrets
        volumeMounts:
        - name: license
          mountPath: /app/.license
          subPath: .license
          readOnly: true
        startupProbe:
          httpGet:
            path: /health
            port: 3310
          failureThreshold: 12
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3310
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3310
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
      volumes:
      - name: license
        secret:
          secretName: hydra-license
---
apiVersion: v1
kind: Service
metadata:
  name: iam-service
  namespace: hydra-prod
spec:
  selector:
    app: iam
  ports:
  - port: 3310
    targetPort: 3310
    name: http
