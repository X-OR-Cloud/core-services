# =============================================================================
# Secrets — điền giá trị thực trước khi apply
# Tất cả values phải được base64-encode:  echo -n "value" | base64
#
# KHÔNG commit file này sau khi đã điền secrets thực.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: xai-db-secrets
  namespace: phuongn21-restricted
type: Opaque
stringData:
  # MongoDB connection string
  MONGODB_URI: "mongodb://<user>:<password>@mongodb-service:27017"
  MONGODB_AUTH_SOURCE: "admin"

  # Redis
  REDIS_URL: "redis://<user>:<password>@redis-service:6379"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_USERNAME: "<redis-username>"
  REDIS_PASSWORD: "<redis-password>"
  REDIS_DB: "0"

  # Qdrant
  QDRANT_URL: "http://qdrant-service:6333"
  QDRANT_API_KEY: "<qdrant-api-key>"

---
apiVersion: v1
kind: Secret
metadata:
  name: xai-app-secrets
  namespace: phuongn21-restricted
type: Opaque
stringData:
  # JWT
  JWT_SECRET: "<jwt-secret-min-32-chars>"

  # Internal API key (service-to-service auth)
  INTERNAL_API_KEY: "<internal-api-key>"

  # Google SSO (nếu dùng — bỏ qua nếu không cần)
  GOOGLE_CLIENT_ID: "<google-client-id>"
  GOOGLE_CLIENT_SECRET: "<google-client-secret>"
  GOOGLE_API_KEY: "<google-api-key>"

  # LLM / Embedding API (trỏ về vLLM nội bộ trong air-gap)
  KB_EMBEDDING_API_KEY: "placeholder"   # vLLM nội bộ không cần key thật
  KB_OCR_API_KEY: "placeholder"

  # Admin account mặc định
  ADMIN_USERNAME: "admin@mb-bank.internal"
  ADMIN_PASSWORD: "<admin-password>"

---
# License file cho tất cả services
# Tạo bằng lệnh: kubectl create secret generic xai-license --from-file=.license=mb-bank.license -n xai-prod
# Hoặc điền thủ công (base64 của nội dung file .license):
apiVersion: v1
kind: Secret
metadata:
  name: xai-license
  namespace: phuongn21-restricted
type: Opaque
data:
  # echo -n "expiry=2026-07-31\nsig=<sig>" | base64
  .license: "<base64-of-license-file-content>"
