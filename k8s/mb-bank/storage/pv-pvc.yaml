# =============================================================================
# PersistentVolumes & PersistentVolumeClaims
#
# Cluster MB Bank có NFS shared storage tại /home-dev (31 TB).
# Các PVs dưới đây dùng NFS làm backend.
#
# Thay <NFS_SERVER_IP> bằng IP thực của NFS server.
# Thay các đường dẫn NFS path nếu cần.
# =============================================================================

# ---- MongoDB ----------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-mongodb
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: <NFS_SERVER_IP>
    path: /home-dev/xai-prod/mongodb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-mongodb
  namespace: xai-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  storageClassName: ""
  volumeName: pv-mongodb

